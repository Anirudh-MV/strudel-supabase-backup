<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strudel Session Sync — Sessions</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.2rem; }
    #msg { font-size: .9rem; min-height: 1.2em; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    th { cursor: pointer; user-select: none; white-space: nowrap; }
    tr.row { cursor: pointer; }
    tr.row:hover { background: #f0f4f0; }
    .name { font-weight: 600; }
    .snippet { color: #666; font-family: ui-monospace, monospace; font-size: .8rem; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .expanded td { background: #fafafa; }
    .expanded pre { max-height: 260px; overflow: auto; background: #1a1a24; color: #d8fce8; padding: .7rem; border-radius: 8px; font-size: .78rem; }
    #pager { display: flex; align-items: center; gap: .8rem; margin-top: 1rem; }
    #pager button { padding: .4rem .9rem; border: 0; border-radius: 6px; background: #1b5e20; color: #fff; cursor: pointer; }
    #pager button:disabled { background: #bbb; cursor: default; }
    .muted { color: #888; }
    button.copy { font-size: .75rem; padding: .25rem .6rem; margin-top: .3rem; }
  </style>
</head>
<body>
  <h1>🌀 Latest sessions</h1>
  <div id="msg" class="muted">Loading…</div>
  <table id="rows"></table>
  <div id="pager" hidden>
    <button id="prev">‹ Prev</button>
    <span id="page" class="muted"></span>
    <button id="next">Next ›</button>
    <button id="refresh" style="margin-left:auto;background:#555">Refresh</button>
  </div>
  <script src="sessions.js"></script>
</body>
</html>
